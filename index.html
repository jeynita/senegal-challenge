
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sénégal Challenge : le jeu de mime et de devinettes entre amis.">
    <title>Sénégal Challenge - Mime, devine, rigole !</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <a class="logo" href="#" aria-label="Sénégal Challenge, accueil">
            Sénégal<span>Challenge</span>
        </a>

        <p class="header-tagline">Le jeu, version Galsen 🇸🇳</p>
    </header>

    <main>
        <section class="hero">
            <p class="eyebrow">TON GROUPE. TES RÈGLES. TON DÉLIRE.</p>

            <h1>
                Mime.<br>
                Devine.<br>
                <span>Rigole !</span>
            </h1>

            <p class="hero-description">
                Réunis tes amis, laisse le hasard former les duos
                et amusez-vous.
            </p>

            <button class="start-button" type="button">
                Commencer à jouer
                <span aria-hidden="true">→</span>
            </button>

            <p class="hero-note">
                Un téléphone · Des amis · Des fous rires
            </p>
        </section>
    </main>

    <footer class="footer">
        <p>Fait pour les moments entre nous.</p>
    </footer>
</body>
</html>
